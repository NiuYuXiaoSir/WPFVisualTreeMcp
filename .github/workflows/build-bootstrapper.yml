name: Build Bootstrapper DLLs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-bootstrapper.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Build x64 (Release)
        run: msbuild src/WpfVisualTreeMcp.Bootstrapper/WpfVisualTreeMcp.Bootstrapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=${{ github.workspace }}/build-out/x64/ /m /v:m

      - name: Build x86 (Release)
        run: msbuild src/WpfVisualTreeMcp.Bootstrapper/WpfVisualTreeMcp.Bootstrapper.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:OutDir=${{ github.workspace }}/build-out/x86/ /m /v:m

      - name: Collect DLLs
        shell: pwsh
        run: |
          # vcxproj 独立构建时 $(SolutionDir) 为空，OutDir 已在构建步骤显式注入为绝对路径
          $x64 = 'build-out/x64/WpfInspectorBootstrapper.dll'
          $x86 = 'build-out/x86/WpfInspectorBootstrapper.dll'
          New-Item -ItemType Directory -Force -Path artifacts/x64, artifacts/x86 | Out-Null
          if (Test-Path $x64) { Copy-Item $x64 artifacts/x64/; Write-Host "x64 OK: $(Get-Item $x64 | Select-Object -ExpandProperty Length) bytes" }
          else { Write-Host "x64 MISSING"; Get-ChildItem -Recurse -Depth 4 -Filter *.dll -ErrorAction SilentlyContinue | Select-Object FullName; exit 1 }
          if (Test-Path $x86) { Copy-Item $x86 artifacts/x86/; Write-Host "x86 OK: $(Get-Item $x86 | Select-Object -ExpandProperty Length) bytes" }
          else { Write-Host "x86 MISSING"; Get-ChildItem -Recurse -Depth 4 -Filter *.dll -ErrorAction SilentlyContinue | Select-Object FullName; exit 1 }
          Get-ChildItem artifacts -Recurse -File | Select-Object FullName, Length

      - name: Commit DLLs to bootstrapper-build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          git commit -m "ci: add built WpfInspectorBootstrapper.dll (x64/x86)" || echo "no changes"
          git branch -f bootstrapper-build HEAD
          git push origin bootstrapper-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrapper
          path: artifacts/