name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore WpfVisualTreeMcp.sln

    - name: Build
      run: dotnet build WpfVisualTreeMcp.sln --no-restore --configuration Release

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    # Build the native bootstrapper into the exact directories the Server csproj's
    # Exists()-guarded <None Include> items collect from, so `dotnet publish` below
    # emits a COMPLETE, locally-testable layout (server + inspector + native/x64 +
    # native/x86). Standalone vcxproj builds have an empty $(SolutionDir), so OutDir
    # must be passed explicitly.
    - name: Build native bootstrapper (x64 + Win32)
      run: |
        msbuild src/WpfVisualTreeMcp.Bootstrapper/WpfVisualTreeMcp.Bootstrapper.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:OutDir=${{ github.workspace }}/src/WpfVisualTreeMcp.Bootstrapper/build/x64/Release/" /m /v:m
        msbuild src/WpfVisualTreeMcp.Bootstrapper/WpfVisualTreeMcp.Bootstrapper.vcxproj /p:Configuration=Release /p:Platform=Win32 "/p:OutDir=${{ github.workspace }}/src/WpfVisualTreeMcp.Bootstrapper/build/Win32/Release/" /m /v:m

    - name: Test
      run: dotnet test WpfVisualTreeMcp.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    - name: Publish MCP Server
      run: dotnet publish src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --no-build --configuration Release --output ./publish

    - name: Verify publish completeness
      shell: pwsh
      run: |
        $required = @(
          'WpfVisualTreeMcp.Server.exe',
          'WpfVisualTreeMcp.Inspector.dll',
          'native/x64/WpfInspectorBootstrapper.dll',
          'native/x86/WpfInspectorBootstrapper.dll',
          'native/x64/WpfVisualTreeMcp.Inspector.dll',
          'native/x86/WpfVisualTreeMcp.Inspector.dll',
          'native/x86/WpfInjectorHelper.exe'
        )
        $missing = @($required | Where-Object { -not (Test-Path (Join-Path './publish' $_)) })
        if ($missing.Count -gt 0) { Write-Host "MISSING FROM PUBLISH:"; $missing | ForEach-Object { Write-Host "  $_" }; exit 1 }
        Write-Host "Publish layout complete:"; Get-ChildItem -Recurse ./publish/native | Select-Object FullName, Length

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wpf-visual-tree-mcp
        path: ./publish

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Server transitively references the WPF (net8.0-windows) Inspector, so a
    # restore/format on Linux needs Windows targeting enabled.
    - name: Restore dependencies
      run: dotnet restore src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj -p:EnableWindowsTargeting=true

    - name: Check formatting
      run: dotnet format src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --verify-no-changes --verbosity diagnostic
      continue-on-error: true

  # Build verification for .NET Framework projects (Windows only)
  build-netfx:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Restore NuGet packages
      run: dotnet restore WpfVisualTreeMcp.sln

    - name: Build .NET Framework projects
      run: |
        dotnet build src/WpfVisualTreeMcp.Inspector/WpfVisualTreeMcp.Inspector.csproj --configuration Release
        dotnet build src/WpfVisualTreeMcp.Injector/WpfVisualTreeMcp.Injector.csproj --configuration Release
        dotnet build samples/SampleWpfApp/SampleWpfApp.csproj --configuration Release
